name: Build
on:
  push:
    branches: [ master, weyve, heat-fe ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, weyve ]
permissions:
  contents: write
jobs:
  # the heat-fe branch carries only the heat-fe target; the hiro build is dead
  # weight there and target-heat-fe does not exist on the other branches
  build:
    if: github.ref != 'refs/heads/heat-fe'
    strategy:
      matrix:
        os:
        - name: ubuntu
          version: latest
        - name: windows
          version: latest
        - name: macos
          version: latest
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      if: matrix.os.name == 'ubuntu'
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install libsdl2-dev libgtk-3-dev gtksourceview-3.0 libao-dev libopenal-dev
    - name: Make
      run: make -j4 -C bsnes local=false
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bsnes-${{ matrix.os.name }}
        path: bsnes/out/bsnes*

  build-heat-fe:
    if: github.ref == 'refs/heads/heat-fe' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os:
        - name: ubuntu
          version: latest
        - name: windows
          version: latest
        # arm64 only; the intel runner (macos-13) is not built
        - name: macos
          version: latest
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # SDL3 is built from source, so it needs its own headers present
    - name: Install Dependencies
      if: matrix.os.name == 'ubuntu'
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
          libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
          libdbus-1-dev
    - name: Make
      run: make -j4 -C bsnes target=heat-fe
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bsnes-heat-fe-${{ matrix.os.name }}-${{ matrix.os.version }}
        path: bsnes/out/bsnes-heat-fe*

  release-heat-fe:
    if: github.ref == 'refs/heads/heat-fe'
    concurrency: release-${{ github.ref }}
    runs-on: ubuntu-latest
    needs:
    - build-heat-fe
    steps:
    - uses: actions/checkout@v4
      with:
        path: 'src'
    - name: Download Artifacts
      uses: actions/download-artifact@v4.1.7
      with:
        path: 'bin'
    - name: Package Artifacts
      run: |
        set -eu
        srcdir="${GITHUB_WORKSPACE}/src"
        bindir="${GITHUB_WORKSPACE}/bin"

        # artifact name -> the name a human downloading it would expect
        package() {
          artifact="$1" label="$2"
          outdir="bsnes-heat-fe"
          rm -rf "${outdir}"
          mkdir "${outdir}"
          cp -a ${bindir}/${artifact}/* "${outdir}"
          cp -a ${srcdir}/GPLv3.txt "${outdir}"
          # a settings.cfg beside the exe is what switches on portable mode, so
          # the config and Firmware/ stay in the folder instead of the profile.
          # Empty on purpose: the app fills it in on first exit, and shipping a
          # defaults dump would override any default changed after this build.
          : > "${outdir}/settings.cfg"
          mkdir "${outdir}/Firmware"
          # github artifacts drop the executable bit
          chmod +x "${outdir}"/bsnes-heat-fe || true
          zip -r "bsnes-heat-fe-${label}.zip" "${outdir}"
        }

        package bsnes-heat-fe-ubuntu-latest  linux-x86_64
        package bsnes-heat-fe-windows-latest windows-x86_64
        package bsnes-heat-fe-macos-latest   macos-arm64
        ls -l bsnes-heat-fe-*.zip
    - name: Calculate release info
      id: relinfo
      run: |
        echo "datetime=$(date -u +"%Y-%m-%d %T %Z")" >> $GITHUB_OUTPUT
        echo "date=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT
    - name: Delete old heat-fe release
      uses: actions/github-script@v7
      with:
        retries: 3
        script: |
          const {owner, repo} = context.repo;
          const channel = 'heat-fe';
          try {
            const release = await github.rest.repos.getReleaseByTag({owner, repo, tag: channel});
            if (release && release.status === 200) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.data.id});
            }
          } catch (e) {
            console.log(`error deleting old release: ${e}`);
          }
          try {
            await github.rest.git.deleteRef({owner, repo, ref: `tags/${channel}`});
          } catch (e) {
            console.log(`error trying to delete ref: ${e}`);
          }
          await github.rest.git.createTag({
            owner,
            repo,
            tag: channel,
            message: 'heat-fe release',
            object: context.sha,
            type: "commit",
          })
    - name: Create heat-fe release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: heat-fe
        name: bsnes heat-fe ${{steps.relinfo.outputs.date}}
        body: |
          Rolling build of the `heat-fe` branch, ${{steps.relinfo.outputs.datetime}}.

          macOS binaries are unsigned, so clear the quarantine flag before running:
          `xattr -dr com.apple.quarantine bsnes-heat-fe`
        files: bsnes-heat-fe-*.zip
        prerelease: true

  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/weyve' || startsWith(github.ref, 'refs/tags/')
    # Prevent multiple conflicting release jobs from running at once.
    concurrency: release-${{ github.ref }}
    env:
      # rolling prerelease tag per branch; tag pushes release under their own name
      CHANNEL: ${{ github.ref == 'refs/heads/weyve' && 'weyve' || 'nightly' }}
    runs-on: ubuntu-latest
    needs:
    - build
    steps:
    - uses: actions/checkout@v4
      with:
        path: 'src'
    - name: Download Artifacts
      uses: actions/download-artifact@v4.1.7
      with:
        path: 'bin'
    - name: Package Artifacts
      run: |
        set -eu
        case ${GITHUB_REF} in
          refs/tags/*) suffix="-${GITHUB_REF#refs/tags/}" ;;
          refs/heads/master) suffix="-nightly" ;;
          refs/heads/weyve) suffix="-weyve" ;;
          *) suffix="" ;;
        esac

        srcdir="${GITHUB_WORKSPACE}/src"
        bindir="${GITHUB_WORKSPACE}/bin"

        # Hack: Workaround for GitHub artifacts losing attributes.
        for program in bsnes
        do
          chmod +x ${bindir}/${program}-ubuntu/${program}
          #chmod +x ${bindir}/${program}-macos/${program}.app/Contents/MacOS/${program}
        done

        for os in ubuntu windows macos
        do
          mkdir "${os}"
          cd "${os}"

          # Package bsnes.
          outdir=bsnes${suffix}
          mkdir ${outdir}
          mkdir ${outdir}/Database
          mkdir ${outdir}/Firmware
          cp -ar ${bindir}/bsnes-${os}/* ${outdir}
          cp -a ${srcdir}/bsnes/Database/* ${outdir}/Database
          cp -a ${srcdir}/shaders ${outdir}/Shaders
          cp -a ${srcdir}/GPLv3.txt ${outdir}
          cp -a ${srcdir}/extras/* ${outdir}
          zip -r ../bsnes-${os}.zip ${outdir}

          cd -
        done
    - name: Calculate release info
      id: relinfo
      run: |
        echo "datetime=$(date -u +"%Y-%m-%d %T %Z")" >> $GITHUB_OUTPUT
        echo "date=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT
    - name: Delete old nightly release
      uses: actions/github-script@v7
      id: release
      if: ${{!startsWith(github.ref, 'refs/tags/')}}
      with:
        retries: 3
        script: |
          const {owner, repo} = context.repo;
          const channel = process.env.CHANNEL;
          try {
            const release = await github.rest.repos.getReleaseByTag({owner, repo, tag: channel});
            if (release && release.status === 200) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.data.id});
            }
          } catch (e) {
            console.log(`error deleting old release: ${e}`);
          }
          try {
            await github.rest.git.deleteRef({owner, repo, ref: `tags/${channel}`});
          } catch (e) {
            console.log(`error trying to delete ref: ${e}`);
          }
          await github.rest.git.createTag({
            owner,
            repo,
            tag: channel,
            message: `${channel} release`,
            object: context.sha,
            type: "commit",
          })
    - name: Create nightly release
      uses: softprops/action-gh-release@v1
      if: ${{!startsWith(github.ref, 'refs/tags/')}}
      with:
        tag_name: ${{env.CHANNEL}}
        name: bsnes ${{env.CHANNEL}} ${{steps.relinfo.outputs.date}}
        body: Auto-generated ${{env.CHANNEL}} release on ${{steps.relinfo.outputs.datetime}}
        files: bsnes*.zip
        prerelease: true
    - name: Create version release
      uses: softprops/action-gh-release@v1
      if: ${{startsWith(github.ref, 'refs/tags/')}}
      with:
        name: bsnes ${{github.ref_name}}
        body: This is bsnes ${{github.ref_name}}, released on ${{steps.relinfo.outputs.date}}.
        files: bsnes*.zip
